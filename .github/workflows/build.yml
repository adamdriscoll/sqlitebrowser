name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.changes.outputs.should-build }}
    steps:
      - name: Compare with the last successful nightly
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== "schedule") {
              core.setOutput("should-build", "true");
              return;
            }

            const { owner, repo } = context.repo;
            const { data: currentRun } = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: context.runId
            });
            const { data: previousRuns } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: currentRun.workflow_id,
              branch: context.ref.replace("refs/heads/", ""),
              event: "schedule",
              status: "success",
              per_page: 1
            });
            const previousRun = previousRuns.workflow_runs[0];
            const shouldBuild = !previousRun || previousRun.head_sha !== context.sha;

            core.setOutput("should-build", shouldBuild.toString());
            if (!shouldBuild) {
              core.notice(`Skipping nightly build: ${context.sha} was already built successfully.`);
            }

  test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore SqliteBrowser.slnx

      - name: Build
        run: dotnet build SqliteBrowser.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SqliteBrowser.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Publish self-contained single file
        shell: pwsh
        run: >
          dotnet publish src/SqliteBrowser.App/SqliteBrowser.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          --output artifacts/${{ matrix.rid }}

      - name: Remove debug symbols
        shell: pwsh
        run: Get-ChildItem artifacts/${{ matrix.rid }} -Filter *.pdb | Remove-Item -Force

      - name: Create ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path artifacts/${{ matrix.rid }}/* -DestinationPath SqliteBrowser-${{ matrix.rid }}.zip

      - name: Create ZIP
        if: runner.os != 'Windows'
        shell: bash
        run: cd artifacts/${{ matrix.rid }} && chmod +x SqliteBrowser.App && zip -r ../../SqliteBrowser-${{ matrix.rid }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: SqliteBrowser-${{ matrix.rid }}
          path: SqliteBrowser-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SqliteBrowser-*
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
